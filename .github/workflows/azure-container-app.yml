name: Build and deploy to Azure Container Apps

on:
  workflow_dispatch:

env:
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/weather-app:latest
  ApiKeys__Geoapify: ${{ secrets.GEOAPIFY_APIKEY }}
  ApiKeys__OpenWeatherMap: ${{ secrets.OPENWEATHER_APIKEY }}
  ApiKeys__WeatherApi: ${{ secrets.WEATHERAPI_APIKEY }}
  APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
  ASPNETCORE_ENVIRONMENT: Production

jobs:
  buildImage:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        run: |
          if [ -z "${{ secrets.DOCKER_HUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_HUB_PASSWORD }}" ]; then
            echo "Error: DOCKER_HUB_USERNAME or DOCKER_HUB_PASSWORD secret is not set."
            exit 1
          fi

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t "$IMAGE_NAME" ./WeatherForecast
          docker push "$IMAGE_NAME"

  deploy:
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: [buildImage]
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: Azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
          allow-no-subscriptions: true

      - name: Install Azure Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_NAME" \
            --set-env-vars \
              ApiKeys__Geoapify="$ApiKeys__Geoapify" \
              ApiKeys__OpenWeatherMap="$ApiKeys__OpenWeatherMap" \
              ApiKeys__WeatherApi="$ApiKeys__WeatherApi" \
              APPLICATIONINSIGHTS_CONNECTION_STRING="$APPLICATIONINSIGHTS_CONNECTION_STRING" \
              ASPNETCORE_ENVIRONMENT="$ASPNETCORE_ENVIRONMENT"
